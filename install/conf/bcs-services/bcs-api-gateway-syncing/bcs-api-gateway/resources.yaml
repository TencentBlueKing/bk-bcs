openapi: 3.0.1
servers:
- url: /
info:
  version: '2.0'
  title: API Gateway Resources
  description: ''
# 请求定义来自对应服务的 Swagger/proto；监控接口遵循 Prometheus HTTP API。
# 路径参数沿用网关占位符名称，JSON body 不重复要求路径中已有的字段。
components:
  responses:
    BCSResponse:
      description: BCS API 响应，具体结构及错误码见对应接口文档
  parameters:
    ProjectCode:
      name: projectCode
      in: path
      required: true
      description: 项目英文名
      schema:
        type: string
    ProjectCodeSnake:
      name: project_code
      in: path
      required: true
      description: 项目英文名
      schema:
        type: string
    ProjectIDOrCode:
      name: projectIDOrCode
      in: path
      required: true
      description: 项目 ID 或英文名
      schema:
        type: string
    ProjectID:
      name: projectID
      in: path
      required: true
      description: 项目 ID
      schema:
        type: string
    ClusterID:
      name: clusterID
      in: path
      required: true
      description: 集群 ID
      schema:
        type: string
    MetadataID:
      name: id
      in: path
      required: true
      description: 模板文件元数据 ID
      schema:
        type: string
    TemplateID:
      name: template_id
      in: path
      required: true
      description: 模板文件元数据 ID
      schema:
        type: string
    TemplateSpaceID:
      name: template_space_id
      in: path
      required: true
      description: 模板文件夹 ID
      schema:
        type: string
    Namespace:
      name: namespace
      in: path
      required: true
      description: 命名空间名称
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      description: 目标名称（仓库、Chart、Release 或集群组件，取决于接口路径）
      schema:
        type: string
    RepoName:
      name: repoName
      in: path
      required: true
      description: Helm 仓库名称
      schema:
        type: string
    ChartVersion:
      name: version
      in: path
      required: true
      description: Chart 版本
      schema:
        type: string
    ProjectAll:
      name: all
      in: query
      description: 查询全量项目；查询有权限的项目时，返回所有项目及权限信息
      schema:
        type: boolean
    ProjectKind:
      name: kind
      in: query
      description: 按项目集群类型过滤，如 k8s、mesos
      schema:
        type: string
    ProjectSearchKey:
      name: searchKey
      in: query
      description: 仅 all=true 时生效，按项目名称或英文名模糊查询，或按项目 ID、业务 ID 精确查询
      schema:
        type: string
    ProjectOffset:
      name: offset
      in: query
      description: 分页偏移量；查询有权限的项目时仅 all=true 生效
      schema:
        type: string
        format: int64
    ProjectLimit:
      name: limit
      in: query
      description: 每页数量；查询有权限的项目时仅 all=true 生效
      schema:
        type: string
        format: int64
    ProjectIDs:
      name: projectIDs
      in: query
      description: 项目 ID，多个以半角逗号分隔
      schema:
        type: string
    ProjectNames:
      name: names
      in: query
      description: 项目中文名称，多个以半角逗号分隔
      schema:
        type: string
    ProjectCodeFilter:
      name: projectCode
      in: query
      description: 按项目英文名过滤
      schema:
        type: string
    ProjectSearchName:
      name: searchName
      in: query
      description: 按项目中文名称模糊查询
      schema:
        type: string
    BusinessID:
      name: businessID
      in: query
      description: 业务 ID
      schema:
        type: string
    UseBCS:
      name: useBCS
      in: query
      description: 业务是否开启 BCS 容器服务
      schema:
        type: boolean
    CloudInfo:
      name: cloudInfo
      in: query
      description: 获取关联的云集群信息，默认从数据库获取
      schema:
        type: boolean
    ClusterProjectID:
      name: projectId
      in: query
      description: 项目 ID，共享集群在自身项目下按独立集群处理
      schema:
        type: string
    ShowVCluster:
      name: showVCluster
      in: query
      description: 展示 vcluster 的 host 共享集群，默认全部展示
      schema:
        type: boolean
    NodeIP:
      name: nodeIP
      in: path
      required: true
      description: 节点内网 IP
      schema:
        type: string
    ShowPwd:
      name: showPwd
      in: query
      description: 节点密码是否展示，默认不展示
      schema:
        type: boolean
    NodeGroupName:
      name: name
      in: query
      description: 节点池名称
      schema:
        type: string
    NodeGroupClusterID:
      name: clusterID
      in: query
      description: 节点池所属 BCS 集群 ID
      schema:
        type: string
    NodeGroupRegion:
      name: region
      in: query
      description: 节点池所属地域
      schema:
        type: string
    NodeGroupProjectID:
      name: projectID
      in: query
      description: 节点池所属项目 ID
      schema:
        type: string
    TemplateSpaceName:
      name: name
      in: query
      description: 模板文件夹名称
      schema:
        type: string
    TemplateSpaceTags:
      name: tags
      in: query
      description: 模板文件夹标签，可重复传入
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ReleaseFilter:
      name: filter
      in: query
      description: Release 历史记录状态过滤
      schema:
        type: string
    NamespaceFilter:
      name: namespace
      in: query
      description: 指定命名空间查询，默认全部命名空间
      schema:
        type: string
    ReleaseNameFilter:
      name: name
      in: query
      description: Release 名称过滤，支持正则表达式
      schema:
        type: string
    Page:
      name: page
      in: query
      description: 页数
      schema:
        type: integer
        format: int64
    Size:
      name: size
      in: query
      description: 每页数量
      schema:
        type: integer
        format: int64
    ChartNameFilter:
      name: name
      in: query
      description: Chart 名称，支持模糊搜索
      schema:
        type: string
    TenantProjectCode:
      name: X-Tenant-Project-Code
      in: header
      required: true
      description: 查询所属的项目英文名
      schema:
        type: string
    OperatorHeader:
      name: X-Operator
      in: header
      description: 操作人，仍需通过后端身份认证与项目权限校验
      schema:
        type: string
    PromLabelName:
      name: name
      in: path
      required: true
      description: Prometheus 标签名称
      schema:
        type: string
    PromQuery:
      name: query
      in: query
      required: true
      description: PromQL 表达式，标签选择器需包含 cluster_id
      schema:
        type: string
    PromTime:
      name: time
      in: query
      description: 查询时间，RFC3339 或 Unix 秒级时间戳，默认当前时间
      schema:
        type: string
    PromTimeout:
      name: timeout
      in: query
      description: 查询超时，如 30s
      schema:
        type: string
    PromStart:
      name: start
      in: query
      description: 开始时间，RFC3339 或 Unix 秒级时间戳
      schema:
        type: string
    PromEnd:
      name: end
      in: query
      description: 结束时间，RFC3339 或 Unix 秒级时间戳
      schema:
        type: string
    PromRangeStart:
      name: start
      in: query
      required: true
      description: 范围查询开始时间，RFC3339 或 Unix 秒级时间戳
      schema:
        type: string
    PromRangeEnd:
      name: end
      in: query
      required: true
      description: 范围查询结束时间，RFC3339 或 Unix 秒级时间戳
      schema:
        type: string
    PromStep:
      name: step
      in: query
      required: true
      description: 查询步长，如 30s 或秒数
      schema:
        type: string
    PromMatches:
      name: match[]
      in: query
      description: 时间序列选择器，可重复传入，如 '{cluster_id="BCS-K8S-00000"}'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    PromRequiredMatches:
      name: match[]
      in: query
      required: true
      description: 时间序列选择器，至少一个，标签需包含 cluster_id
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          type: string
    QuotaID:
      name: quotaId
      in: path
      required: true
      description: 项目配额 ID
      schema:
        type: string
    NodeGroupID:
      name: nodeGroupID
      in: path
      required: true
      description: 节点池 ID
      schema:
        type: string
    TemplateConfigID:
      name: templateConfigID
      in: path
      required: true
      description: 模板配置 ID
      schema:
        type: string
    CloudID:
      name: cloudID
      in: path
      required: true
      description: 云厂商模板 ID，如 tencentCloud
      schema:
        type: string
    TaskID:
      name: taskID
      in: path
      required: true
      description: 任务 ID
      schema:
        type: string
    BusinessIDPath:
      name: businessID
      in: path
      required: true
      description: 业务 ID
      schema:
        type: string
    NodeTemplateID:
      name: nodeTemplateID
      in: path
      required: true
      description: 节点模板 ID
      schema:
        type: string
    VariableID:
      name: variableID
      in: path
      required: true
      description: 变量 ID
      schema:
        type: string
  schemas:
    CreateNamespaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 命名空间名称，最长 63 字符，使用小写字母、数字和连字符
        quota:
          type: object
          description: 命名空间配额
          properties:
            cpuRequests:
              type: string
              description: requests.cpu
            memoryRequests:
              type: string
              description: requests.memory
            cpuLimits:
              type: string
              description: limits.cpu
            memoryLimits:
              type: string
              description: limits.memory
        labels:
          type: array
          description: 命名空间标签
          items:
            $ref: '#/components/schemas/KeyValue'
        annotations:
          type: array
          description: 命名空间注解
          items:
            $ref: '#/components/schemas/KeyValue'
        variables:
          type: array
          description: 命名空间变量列表
          items:
            $ref: '#/components/schemas/VariableValue'
    SharedClusterNamespaceCallbackRequest:
      type: object
      description: 共享集群命名空间 ITSM 回调
      properties:
        title:
          type: string
          description: ITSM 单据标题
        id:
          type: string
          description: ITSM 单号 ID
        status:
          type: string
          description: ITSM 单据状态
        approveResult:
          type: boolean
          description: 单据审批结果
        ticketUrl:
          type: string
          description: ITSM 单据链接
        formData:
          type: object
          description: ITSM 单据数据
          properties:
            title:
              type: string
              description: ITSM 单据标题
            projectCode:
              type: string
              description: 项目英文名
            clusterId:
              type: string
              description: 集群 ID
            namespace:
              type: string
              description: 命名空间
    KeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    VariableValue:
      type: object
      properties:
        id:
          type: string
          description: 变量 ID
        key:
          type: string
          description: 变量 key
        name:
          type: string
          description: 变量名称
        clusterID:
          type: string
          description: 集群 ID
        clusterName:
          type: string
          description: 集群名称
        namespace:
          type: string
          description: 命名空间
        value:
          type: string
          description: 变量值
        scope:
          type: string
          description: 变量作用域
    DeployTemplateRequest:
      type: object
      required: [clusterID, namespace]
      properties:
        templateVersions:
          type: array
          description: 模板文件版本 ID 列表
          items:
            type: string
        variables:
          type: object
          description: 模板文件变量值
          additionalProperties:
            type: string
        clusterID:
          type: string
          description: 目标集群 ID
        namespace:
          type: string
          description: 目标命名空间
        values:
          type: string
          description: 模板集 values 内容
    GetTemplateVersionRequest:
      type: object
      required: [templateSpace, templateName, version]
      properties:
        templateSpace:
          type: string
          description: 模板文件夹名称
        templateName:
          type: string
          description: 模板文件名称
        version:
          type: string
          description: 模板文件版本
    ListTemplateVariablesRequest:
      type: object
      required: [clusterID, namespace]
      properties:
        templateVersions:
          type: array
          description: 模板文件版本 ID 列表
          items:
            type: string
        clusterID:
          type: string
          description: 集群 ID
        namespace:
          type: string
          description: 命名空间
    InstallReleaseRequest:
      type: object
      properties:
        repository:
          type: string
          description: Chart 所属仓库
        chart:
          type: string
          description: Chart 名称
        version:
          type: string
          description: Chart 版本
        values:
          type: array
          description: values 文件内容，越靠后优先级越高
          items:
            type: string
        args:
          type: array
          description: 额外 Helm 参数
          items:
            type: string
        valueFile:
          type: string
          description: 上一次更新使用的 values 文件
        operator:
          type: string
          description: 操作者
        env:
          type: string
          description: 环境
    UpgradeReleaseRequest:
      $ref: '#/components/schemas/InstallReleaseRequest'
    ReleasePreviewRequest:
      type: object
      properties:
        repository:
          type: string
          description: Chart 所属仓库
        chart:
          type: string
          description: Chart 名称
        version:
          type: string
          description: Chart 版本
        values:
          type: array
          description: values 文件内容，越靠后优先级越高
          items:
            type: string
        args:
          type: array
          description: 额外 Helm 参数
          items:
            type: string
        revision:
          type: integer
          format: int64
          description: 为 0 时比较当前渲染结果与已部署的最新版本，否则比较最新版本与指定版本
    RollbackReleaseRequest:
      type: object
      properties:
        revision:
          type: integer
          format: int64
          description: 要回滚到的 Release revision
    CreateWebConsoleSessionRequest:
      type: object
      required: [operator]
      anyOf:
        - required: [container_id]
        - required: [namespace, pod_name, container_name]
      properties:
        operator:
          type: string
          minLength: 1
          description: 当前使用者，仍需通过后端身份认证与集群权限校验
        container_id:
          type: string
          minLength: 1
          description: 容器 ID，与 namespace、pod_name、container_name 组合至少提供一种
        namespace:
          type: string
          minLength: 1
          description: 命名空间
        pod_name:
          type: string
          minLength: 1
          description: Pod 名称
        container_name:
          type: string
          minLength: 1
          description: 容器名称
        command:
          type: string
          description: 自定义 WebConsole 启动命令
        conn_idle_timeout:
          type: integer
          format: int64
          minimum: 0
          maximum: 1439
          description: 空闲超时（分钟），0 或未设置时使用服务默认值
        session_timeout:
          type: integer
          format: int64
          minimum: 0
          maximum: 1439
          description: 会话有效期（分钟），0 或未设置时使用服务默认值
        viewers:
          type: array
          description: 共享查看人
          items:
            type: string
        ws_acquire:
          type: boolean
          description: 是否返回 websocket_url
    ScaleDownProjectQuotaRequest:
      type: object
      title: ScaleDownProjectQuotaRequest
      properties:
        quota:
          type: object
          properties:
            cpu:
              type: object
              title: DeviceInfo device data (cpu/mem/gpu)
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                deviceType:
                  type: string
                deviceQuota:
                  type: string
                deviceQuotaUsed:
                  type: string
            gpu:
              type: object
              title: DeviceInfo device data (cpu/mem/gpu)
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                deviceType:
                  type: string
                deviceQuota:
                  type: string
                deviceQuotaUsed:
                  type: string
            mem:
              type: object
              title: DeviceInfo device data (cpu/mem/gpu)
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                deviceType:
                  type: string
                deviceQuota:
                  type: string
                deviceQuotaUsed:
                  type: string
            zoneResources:
              type: object
              title: InstanceTypeConfig 整机资源配置
              properties:
                cpu:
                  type: integer
                  title: cpu
                  format: int64
                  description: 机型cpu信息，与机型instanceType互斥，比instanceType优先级高
                gpu:
                  type: integer
                  title: gpu
                  format: int64
                  description: 机型gpu信息，与机型instanceType互斥，比instanceType优先级高，可以会为0
                mem:
                  type: integer
                  title: mem
                  format: int64
                  description: 机型mem信息，与机型instanceType互斥，比instanceType优先级高
                region:
                  type: string
                  title: region
                  description: 地域
                zoneId:
                  type: string
                  title: zoneId
                  example: example-id-123
                  description: 可用区Id
                quotaNum:
                  type: integer
                  title: quotaNum
                  format: int64
                  description: 机型申请的配额
                zoneName:
                  type: string
                  title: zoneName
                  description: 可用区名称
                dataDisks:
                  type: array
                  items:
                    type: object
                    title: DataDisk 数据盘定义
                    properties:
                      diskSize:
                        type: string
                        title: diskSize
                        description: 数据盘大小，10G起跳，默认为0，为0时不购买
                      diskType:
                        type: string
                        title: diskType
                        description: 数据盘类型，LOCAL_BASIC（默认）,LOCAL_SSD,CLOUD_BASE,CLOUD_SSD,CLOUD_PREMIUM(高性能云硬盘)
                  title: dataDisks
                  description: 数据盘信息，无默认设置则不购买
                quotaUsed:
                  type: integer
                  title: quotaUsed
                  format: int64
                  description: 机型已使用的配额
                systemDisk:
                  type: object
                  title: DataDisk 数据盘定义
                  properties:
                    diskSize:
                      type: string
                      title: diskSize
                      description: 数据盘大小，10G起跳，默认为0，为0时不购买
                    diskType:
                      type: string
                      title: diskType
                      description: 数据盘类型，LOCAL_BASIC（默认）,LOCAL_SSD,CLOUD_BASE,CLOUD_SSD,CLOUD_PREMIUM(高性能云硬盘)
                instanceType:
                  type: string
                  title: instanceType
                  description: 机型
        updater:
          type: string
          title: updater
          format: date-time
          example: '2024-01-01T00:00:00Z'
          description: 操作人
      description: 缩容项目维度的资源quota
    ScaleUpProjectQuotaRequest:
      type: object
      title: ScaleUpProjectQuotaRequest
      properties:
        quota:
          type: object
          properties:
            cpu:
              type: object
              title: DeviceInfo device data (cpu/mem/gpu)
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                deviceType:
                  type: string
                deviceQuota:
                  type: string
                deviceQuotaUsed:
                  type: string
            gpu:
              type: object
              title: DeviceInfo device data (cpu/mem/gpu)
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                deviceType:
                  type: string
                deviceQuota:
                  type: string
                deviceQuotaUsed:
                  type: string
            mem:
              type: object
              title: DeviceInfo device data (cpu/mem/gpu)
              properties:
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                deviceType:
                  type: string
                deviceQuota:
                  type: string
                deviceQuotaUsed:
                  type: string
            zoneResources:
              type: object
              title: InstanceTypeConfig 整机资源配置
              properties:
                cpu:
                  type: integer
                  title: cpu
                  format: int64
                  description: 机型cpu信息，与机型instanceType互斥，比instanceType优先级高
                gpu:
                  type: integer
                  title: gpu
                  format: int64
                  description: 机型gpu信息，与机型instanceType互斥，比instanceType优先级高，可以会为0
                mem:
                  type: integer
                  title: mem
                  format: int64
                  description: 机型mem信息，与机型instanceType互斥，比instanceType优先级高
                region:
                  type: string
                  title: region
                  description: 地域
                zoneId:
                  type: string
                  title: zoneId
                  example: example-id-123
                  description: 可用区Id
                quotaNum:
                  type: integer
                  title: quotaNum
                  format: int64
                  description: 机型申请的配额
                zoneName:
                  type: string
                  title: zoneName
                  description: 可用区名称
                dataDisks:
                  type: array
                  items:
                    type: object
                    title: DataDisk 数据盘定义
                    properties:
                      diskSize:
                        type: string
                        title: diskSize
                        description: 数据盘大小，10G起跳，默认为0，为0时不购买
                      diskType:
                        type: string
                        title: diskType
                        description: 数据盘类型，LOCAL_BASIC（默认）,LOCAL_SSD,CLOUD_BASE,CLOUD_SSD,CLOUD_PREMIUM(高性能云硬盘)
                  title: dataDisks
                  description: 数据盘信息，无默认设置则不购买
                quotaUsed:
                  type: integer
                  title: quotaUsed
                  format: int64
                  description: 机型已使用的配额
                systemDisk:
                  type: object
                  title: DataDisk 数据盘定义
                  properties:
                    diskSize:
                      type: string
                      title: diskSize
                      description: 数据盘大小，10G起跳，默认为0，为0时不购买
                    diskType:
                      type: string
                      title: diskType
