              type: array
              items:
                type: string
              title: zones
              description: 弹性伸缩组扩容实例首选的可用区ID，多个可用区按照先后顺序确认优先级，靠前优先级高
            maxSize:
              type: integer
              title: maxSize
              format: int64
              description: 弹性伸缩组最大实例数
            minSize:
              type: integer
              title: minSize
              format: int64
              description: 伸缩组最小实例数
            subnetIDs:
              type: array
              items:
                type: string
              title: subnetIDs
              description: 弹性伸缩组扩容实例首选的的子网ID，多个子网ID按照先后顺序确认优先级，靠前优先级高
            timeRanges:
              type: array
              items:
                type: object
                title: TimeRange
                properties:
                  name:
                    type: string
                    title: name
                    description: 定时扩缩job名称
                  zone:
                    type: string
                    title: zone
                    description: 定时cron时区,如果不执行时区则默认是服务所在时区
                  schedule:
                    type: string
                    title: schedule
                    description: 定时cron时间
                  desiredNum:
                    type: integer
                    title: desiredNum
                    format: int64
                    description: 期望节点数
                description: autoScale定时扩缩配置
              title: timeRanges
              description: 定时自动扩容集群节点配置信息
            autoUpgrade:
              type: boolean
              title: autoUpgrade
              format: boolean
              description: 开启自动升级GKE版本功能,如果集群为发布版本,则强制开启
            desiredSize:
              type: integer
              title: desiredSize
              format: int64
              description: 弹性伸缩期望实例数
            retryPolicy:
              type: string
              title: retryPolicy
              description: 创建实例失败时的重试策略：IMMEDIATE_RETRY(最大5次)，INCREMENTAL_INTERVALS，NO_RETRY。默认值为IMMEDIATE_RETRY。扩容时默认会组合subnet和zone信息逐一尝试实例创建直到最大失败次数或者所有组合全失败。
            scalingMode:
              type: string
              title: scalingMode
              description: 扩容模式，CLASSIC_SCALING(默认)：扩容时创建新实例，缩容时销毁实例；WAKE_UP_STOPPED_SCALING：缩容时关机不销毁，扩容时优先唤醒关机实例。
