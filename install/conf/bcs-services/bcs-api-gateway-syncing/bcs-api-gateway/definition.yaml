spec_version: 2

release:
  # 发布版本号，
  # 资源配置更新，需更新此版本号才会发布资源版本，此版本号和 sdk 版本号一致，错误设置会影响调用方使用
  version: "{{ environ.BKAPI_RELEASE_VERSION }}"
  # 版本描述
  comment: "{{ environ.BKAPI_RELEASE_COMMENT }}"

apigateway:
  description: "{{ environ.BKAPI_DESCRIPTION }}"
  is_public: true
  api_type: 1
  maintainers:
    - "admin"
  {% for user in settings.BK_APIGW_MANAGERS %}
    - "{{ user }}"
  {% endfor %}

stages:
  - name: "prod"
    # 环境变量
    vars: {}
    # 保留原代理地址、超时和负载均衡配置
    backends:
      - name: "default"
        config:
          timeout: 60
          loadbalance: "roundrobin"
          hosts:
            - host: "{{ environ.BKAPI_STAGE_HOST }}"
              weight: 100
    # 流量控制
    rate_limit:
      enabled: false
      rate:
        tokens: 5000
        period: 60
    # 按资源域拆分，最终名称 {BK_APIGW_NAME}-prod-{name}；工具名沿用 resources.yaml 中的 operationId
    mcp_servers:
      - name: "project"
        title: "蓝鲸容器平台-项目查询"
        description: "BCS 有权限的项目列表、项目详情及项目关联业务"
        labels:
          - "bcs"
        resource_names:
          - list_auth_projects
          - get_project
          - get_project_business
        is_public: true
        protocol_type: "streamable_http"
        status: 1
        # MCP 授权与资源授权分别同步，复用现有应用白名单
        target_app_codes:
          - "{{ settings.BK_APP_CODE }}"
        {% for app in settings.BK_API_GRANT_PERMISSIONS_APPS %}
          - "{{ app }}"
        {% endfor %}
        oauth2_public_client_enabled: true
        oauth2_personal_client_enabled: true
        raw_response_enabled: false
        category_names: ["Official", "ConfigManagement"]
      - name: "cluster"
        title: "蓝鲸容器平台-集群管理"
        description: "BCS 项目集群与共享集群、命名空间、节点及上下架/驱逐/标签/污点/注解、节点池及弹性伸缩开关、集群任务查询与重试/跳过等操作"
        labels:
          - "bcs"
        resource_names:
          - list_project_clusters
          - list_shared_clusters
          - get_cluster_detail
          - list_native_namespaces
          - list_namespaces
          - get_namespace
          - get_node_info
          - list_nodes_in_cluster
          - list_cluster_nodes
          - update_node_annotations
          - update_node_labels
          - update_node_taints
          - cordon_node
          - uncordon_node
          - check_drain_node
          - drain_node
          - list_cluster_nodegroups
          - get_nodegroup
          - create_nodegroup
          - list_nodes_in_group
          - enable_nodegroup_autoscale
          - disable_nodegroup_autoscale
          - list_tasks
          - get_task
          - retry_task
          - skip_task
        is_public: true
        protocol_type: "streamable_http"
        status: 1
        # MCP 授权与资源授权分别同步，复用现有应用白名单
        target_app_codes:
          - "{{ settings.BK_APP_CODE }}"
        {% for app in settings.BK_API_GRANT_PERMISSIONS_APPS %}
          - "{{ app }}"
        {% endfor %}
        oauth2_public_client_enabled: true
        oauth2_personal_client_enabled: true
        raw_response_enabled: false
        category_names: ["Official", "Automation"]
      - name: "deploy"
        title: "蓝鲸容器平台-部署服务"
        description: "BCS Helm 仓库、Chart、Release 的查询与安装/升级/回滚/卸载，以及模板文件的查询、预览与部署"
        labels:
          - "bcs"
        resource_names:
          - list_repos
          - get_repo
          - list_charts
          - get_chart_detail
          - get_chart_versions
          - get_chart_version_detail
          - get_chart_releases
          - list_releases
          - get_release_detail
          - get_release_detail_extend
          - get_release_history
          - get_release_pods
          - get_release_status
          - release_preview
          - install_release
          - upgrade_release
          - rollback_release
          - uninstall_release
          - list_template_space
          - list_template
          - get_template
          - list_template_versions
          - get_template_version
          - list_template_vaiables
          - preview_deploy_template
          - deploy_template
        is_public: true
        protocol_type: "streamable_http"
        status: 1
        # MCP 授权与资源授权分别同步，复用现有应用白名单
        target_app_codes:
          - "{{ settings.BK_APP_CODE }}"
        {% for app in settings.BK_API_GRANT_PERMISSIONS_APPS %}
          - "{{ app }}"
        {% endfor %}
        oauth2_public_client_enabled: true
        oauth2_personal_client_enabled: true
        raw_response_enabled: false
        category_names: ["Official", "DevOps"]

# 主动授权，网关主动给应用，添加访问网关所有资源的权限
grant_permissions:
  - bk_app_code: "{{ settings.BK_APP_CODE }}"
  {% for app in settings.BK_API_GRANT_PERMISSIONS_APPS %}
  - bk_app_code: "{{ app }}"
  {% endfor %}

# 应用申请指定网关所有资源的权限，待网关管理员审批后，应用才可访问网关资源
apply_permissions:
  {% for gw in settings.BK_API_APPLY_PERMISSIONS_GATEWAYS %}
  - api_name: "{{ gw }}"
  {% endfor %}

resource_docs:
  # 资源文档目录，basedir 与 archivefile 二者至少一个有效，若同时存在，则 archivefile 优先
  basedir: "{{ settings.BK_APIGW_RESOURCE_DOCS_BASE_DIR }}"
